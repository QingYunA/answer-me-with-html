name: Release

# A release is a version bump merged to main (see CONTRIBUTING.md, "Releasing").
# When package.json changes on main and the tag for its version does not exist yet,
# tag the pushed commit and publish the GitHub Release from changelog/<version>.md.

on:
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip when the Release exists
        id: state
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists. Nothing to do."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          # A tag without a Release: an earlier run pushed the tag and then failed. Publish from that tag.
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes exist and start with the version marker
        if: steps.state.outputs.release == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Same rule as test/release-notes.test.js.
          file="changelog/${VERSION}.md"
          if [[ ! -f "$file" ]]; then
            echo "::error::${file} is missing. Write the notes for this release first."
            exit 1
          fi
          if [[ ! "$(head -n 1 "$file")" =~ ^"<!-- release ${VERSION} "[0-9]{4}-[0-9]{2}-[0-9]{2}" -->"$ ]]; then
            echo "::error file=${file}::The first line must be <!-- release ${VERSION} YYYY-MM-DD -->."
            exit 1
          fi
          day="$(head -n 1 "$file" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')"
          if [[ "$(date -u -d "$day" +%F 2>/dev/null)" != "$day" ]]; then
            echo "::error file=${file}::${day} is not a real date."
            exit 1
          fi
      - name: Tag
        if: steps.state.outputs.release == 'false' && steps.state.outputs.tag == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"
      - name: Publish the Release
        if: steps.state.outputs.release == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "changelog/${VERSION}.md"

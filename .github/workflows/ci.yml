name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # 每周一跑一次：上游 skills CLI / Claude Code 变化导致安装失败时尽早发现
  workflow_dispatch:

jobs:
  test:
    # 单元测试 + 健壮性测试：Linux 跑三个 Node 版本，macOS / Windows 各跑一个（用户主要在 macOS 上用）。
    # full 格子（ubuntu / Node 22）还跑只需跑一次的检查：bundle、覆盖率、examples、网站、HTML snapshot、真实安装。
    name: test (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22, full: true }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@v4
        with:
          # The snapshot step compares with the PR base.
          fetch-depth: ${{ matrix.full && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        if: ${{ !matrix.full }}
      - name: Bundle is up to date
        if: ${{ matrix.full }}
        run: npm run build && git diff --exit-code skills/answer-me-with-html/scripts/am.mjs
      - name: Tests with coverage thresholds (lines 85, functions 85, branches 80)
        if: ${{ matrix.full }}
        run: npm run coverage
      - name: Render examples with the bundled CLI
        if: ${{ matrix.full }}
        run: |
          set -euo pipefail
          export AM_NO_UPDATE_CHECK=1 AM_HOME="$RUNNER_TEMP/am-home"
          AM=skills/answer-me-with-html/scripts/am.mjs
          for f in examples/*.md; do
            name=$(basename "$f" .md)
            case "$name" in
              video-*) node "$AM" video "$f" --voice off --no-open -o "out/$name.html" ;;
              *) node "$AM" render "$f" --no-open -o "out/$name.html" ;;
            esac
          done
      # The project website builds: browser engine bundle, prerendered examples and both language pages.
      - name: Build the website
        if: ${{ matrix.full && github.event_name == 'pull_request' }}
        run: npm run site
      # Refactors keep the HTML byte-identical (CONTRIBUTING.md). The step reports the comparison with the PR base
      # in the job summary and does not fail: an intended difference is called out in the PR instead.
      - name: Compare the rendered HTML with the PR base
        if: ${{ matrix.full && github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if node scripts/snapshot.mjs "$BASE" > snapshot.txt 2>&1; then status=same; else status=different; fi
          cat snapshot.txt
          { echo "### HTML snapshot against $BASE"; echo '```'; cat snapshot.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = different ]; then echo "::warning::The rendered HTML differs from $BASE. Call out the difference in the PR, or fix it."; fi
      # 真实安装冒烟测试：npx skills add、claude plugin install、hook 输出、插件清单校验（自带临时 HOME）。
      - name: Install smoke test
        if: ${{ matrix.full }}
        run: npm run smoke:install

  video:
    # 视频端到端：espeak-ng 配音 + 无头 Chrome 逐帧 + ffmpeg 编码，确认播放页脚本在真实浏览器里能跑完。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm ci
      - name: End-to-end video tests
        run: AM_E2E=1 node --test --test-timeout=300000 --test-name-pattern=e2e test/video.test.js
      - name: Browser tests in headless Chrome
        run: AM_E2E=1 node --test --test-timeout=300000 test/*-browser.test.js
      - name: Export an example video to MP4
        run: |
          set -euo pipefail
          export AM_NO_UPDATE_CHECK=1 AM_HOME="$RUNNER_TEMP/am-home"
          node skills/answer-me-with-html/scripts/am.mjs video examples/video-tcp.en.md --voice system --no-open -o out/video.html --mp4
          ffprobe -v error -show_entries stream=codec_type,width,height -of csv=p=0 out/video.mp4 | tee probe.txt
          grep -q 'video,1920,1080' probe.txt
          grep -q 'audio' probe.txt

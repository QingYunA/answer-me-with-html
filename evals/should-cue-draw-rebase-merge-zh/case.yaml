schema_version: "1.1"
name: should-cue-draw-rebase-merge-zh
tags: [should-trigger, user-cue]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    git rebase 和 merge 的区别我一直没看懂，能画个图讲讲吗？
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

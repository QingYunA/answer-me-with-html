schema_version: "1.1"
name: should-findings-security-review
tags: [should-trigger, findings]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Review findings: (1) the auth token never expires, (2) the search endpoint builds SQL by string concatenation, (3) there is no rate limit on login, (4) logs contain user emails. How serious is each one, how do they relate, and in what order should we fix them?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

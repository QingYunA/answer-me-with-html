schema_version: "1.1"
name: holdout-should-k8s-apply-flow
tags: [should-trigger, holdout, flow]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Walk me through what happens inside Kubernetes when I run kubectl apply on a Deployment.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

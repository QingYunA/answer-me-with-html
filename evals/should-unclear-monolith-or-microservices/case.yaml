schema_version: "1.1"
name: should-unclear-monolith-or-microservices
tags: [should-trigger, unclear-conclusion]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    We have 3 engineers, one Postgres database and about 200 requests per second. Should we move to microservices or stay on the monolith? I honestly can't tell which is right.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

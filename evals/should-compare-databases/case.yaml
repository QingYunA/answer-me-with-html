schema_version: "1.1"
name: should-compare-databases
tags: [should-trigger, comparison]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Compare PostgreSQL, MySQL and SQLite for a small SaaS product: consistency, concurrency, operations cost and how each one scales.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

schema_version: "1.1"
name: should-not-port-in-use-zh
tags: [should-not-trigger, hard-negative]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    怎么在 Linux 里查看某个端口被谁占用？
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
    min: 0
    max: 0
    arm: both

schema_version: "1.1"
name: holdout-should-build-or-buy-queue-zh
tags: [should-trigger, holdout, unclear-conclusion]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    我们小团队要不要自建消息队列，还是直接用云厂商的托管服务？成本、运维、锁定都有顾虑，我拿不准。
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

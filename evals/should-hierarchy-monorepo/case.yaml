schema_version: "1.1"
name: should-hierarchy-monorepo
tags: [should-trigger, hierarchy]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    A typical monorepo has apps/, packages/, tools/ and infra/ folders. Explain how these relate to each other and what depends on what.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

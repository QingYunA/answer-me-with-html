schema_version: "1.1"
name: holdout-should-rest-graphql-grpc
tags: [should-trigger, holdout, comparison]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Compare REST, GraphQL and gRPC for an internal service mesh on latency, schema evolution, tooling and learning curve.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

schema_version: "1.1"
name: holdout-should-django-structure-zh
tags: [should-trigger, holdout, hierarchy]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    一个典型的 Django 项目里，settings、urls、views、models、templates 之间是什么关系？
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

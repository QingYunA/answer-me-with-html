schema_version: "1.1"
name: holdout-should-not-center-div-zh
tags: [should-not-trigger, holdout]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    怎么让一个 div 水平垂直居中？
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
    min: 0
    max: 0
    arm: both

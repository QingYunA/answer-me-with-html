schema_version: "1.1"
name: should-not-translate-sentence-zh
tags: [should-not-trigger]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    把这句话翻译成英文：我们明天上午十点开会。
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
    min: 0
    max: 0
    arm: both

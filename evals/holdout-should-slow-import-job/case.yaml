schema_version: "1.1"
name: holdout-should-slow-import-job
tags: [should-trigger, holdout, unclear-conclusion]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Our nightly import job sometimes takes 4 hours instead of 40 minutes. We see lock waits, a slow disk and a memory spike at different times. Where would you look first and why?
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

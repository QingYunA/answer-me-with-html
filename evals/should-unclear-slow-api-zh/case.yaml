schema_version: "1.1"
name: should-unclear-slow-api-zh
tags: [should-trigger, unclear-conclusion]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    我们的接口偶尔变慢，可能是数据库锁、连接池耗尽或者 GC，三个都有一点证据。应该先查哪个？怎么判断？
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'

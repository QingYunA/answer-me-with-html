schema_version: "1.1"
name: should-not-friendlier-rewrite
tags: [should-not-trigger, hard-negative]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Rewrite this to sound friendlier: 'Your request was denied.'
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
    min: 0
    max: 0
    arm: both

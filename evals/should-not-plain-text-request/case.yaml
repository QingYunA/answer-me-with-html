schema_version: "1.1"
name: should-not-plain-text-request
tags: [should-not-trigger, gate]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Compare REST, GraphQL and gRPC on latency, tooling and learning curve. Plain text only please, no HTML, no diagrams.
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
    min: 0
    max: 0
    arm: both

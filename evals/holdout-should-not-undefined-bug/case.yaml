schema_version: "1.1"
name: holdout-should-not-undefined-bug
tags: [should-not-trigger, holdout]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    Why does this print undefined? const user = {name: 'a'}; console.log(user.age)
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
    min: 0
    max: 0
    arm: both

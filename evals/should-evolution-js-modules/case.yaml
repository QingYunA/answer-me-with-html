schema_version: "1.1"
name: should-evolution-js-modules
tags: [should-trigger, evolution]
execution:
  max_turns: 2
  timeout_seconds: 600
  allowed_tools: [Skill]
  prompt: |
    How did JavaScript module systems evolve from plain script tags to ES modules? Cover the main stages and why each one replaced the last.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?answer-me-with-html"'
